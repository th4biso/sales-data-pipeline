name: Continuous Integration

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the 19 unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v

      - name: Run the pipeline on the sample data
        run: python run_pipeline.py
